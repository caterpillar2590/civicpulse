apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: civicpulse-config
    patch: |-
      - op: replace
        path: /data/TRIAGE_PROVIDER
        value: simulated

images:
  - name: ghcr.io/OWNER/civicpulse-backend
    newTag: dev
  - name: ghcr.io/OWNER/civicpulse-frontend
    newTag: dev
