apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: civicpulse-config
    patch: |-
      - op: replace
        path: /data/TRIAGE_PROVIDER
        value: llm

# cd.yml runs `kustomize edit set image ...=ghcr.io/OWNER/civicpulse-backend:<SHA>`
# here before `kubectl apply -k`, so production always deploys by immutable
# commit SHA (or digest for the bonus), never `latest`.
images:
  - name: ghcr.io/OWNER/civicpulse-backend
    newTag: latest   # placeholder - overwritten by cd.yml at deploy time
  - name: ghcr.io/OWNER/civicpulse-frontend
    newTag: latest   # placeholder - overwritten by cd.yml at deploy time
