# Committed manifest carries PLACEHOLDERS ONLY - never a real password or
# key. Real values are supplied at deploy time via `kubectl create secret`,
# a CI step reading GitHub Secrets, or a secrets manager - never checked
# into git. See docs/RUNBOOK.md for how cd.yml populates this in practice.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  GROQ_API_KEY: "REPLACE_ME"
