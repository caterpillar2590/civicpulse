apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse-ingress
  namespace: civicpulse
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: civicpulse.local   # add to /etc/hosts pointing at the cluster's ingress IP
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 8080
