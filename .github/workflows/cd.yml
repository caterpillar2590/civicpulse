name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/15"
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: backend
        run: |
          pip install --break-system-packages -e ".[dev]"
          pytest --cov=app --cov-fail-under=65
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: frontend
        run: |
          npm ci
          npm run test

  build-push:
    runs-on: ubuntu-latest
    needs: [test]   # never publish what we haven't just proven passes
    outputs:
      backend_digest: ${{ steps.build-backend.outputs.digest }}
      frontend_digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # A scoped, revocable registry token - never an account password.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend (tagged by commit SHA and latest)
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
      - name: Build + push frontend
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: backend-sbom.spdx.json
      - name: Generate SBOM (frontend)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: frontend-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: "*-sbom.spdx.json"

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [build-push]   # never deploy an image that wasn't just built here
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: civicpulse-ci

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Set image to this commit's SHA - never :latest
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            ghcr.io/OWNER/civicpulse-backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ghcr.io/OWNER/civicpulse-frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Create image pull secret and app secrets
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic civicpulse-secrets \
            --from-literal=POSTGRES_PASSWORD=${{ secrets.CI_POSTGRES_PASSWORD || 'ci-only-password' }} \
            --from-literal=GROQ_API_KEY=${{ secrets.GROQ_API_KEY || '' }} \
            -n civicpulse --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl -n civicpulse rollout status deployment/backend --timeout=180s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s

      - name: Smoke test against the Ingress
        run: |
          kubectl -n civicpulse port-forward svc/backend 8000:8000 &
          sleep 3
          curl -sf http://localhost:8000/ready

      - name: Show HPA state
        run: kubectl -n civicpulse get hpa
