name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build + push backend (semver tags)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}

      - name: Build + push frontend (semver tags)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}

      - name: Generate release notes and publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "CivicPulse ${{ github.ref_name }}"
