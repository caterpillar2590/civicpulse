server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /config.js is regenerated at container start (docker-entrypoint.sh) -
    # never cache it, or a redeploy with new env vars won't take effect.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /config.js =404;
    }

    # Proxy /api to the backend service. This is the "frontend never needs
    # an absolute backend URL" option from the assignment spec - the
    # alternative (window.__CONFIG__.API_BASE_URL) still works if set.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
